<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Heal In Tree — Spin vs Steady</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#d4af37; --bg:#0a0a0a; --dim:#999; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:'Cormorant Garamond',serif; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  .tag { position:fixed; top:calc(30px + env(safe-area-inset-top)); z-index:3; text-align:center;
         color:var(--gold); pointer-events:none; width:50%; font-size:17px; letter-spacing:.22em; }
  .tag small { display:block; color:var(--dim); font-size:12px; letter-spacing:.1em; font-style:italic; margin-top:4px; }
  #tagA { left:0; }
  #tagB { right:0; }
  .foot { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; z-index:3;
          text-align:center; color:var(--dim); font-size:14px; letter-spacing:.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="cmp"></canvas>
<div class="tag" id="tagA">A · SPINNING<small>globe rotates (current live build)</small></div>
<div class="tag" id="tagB">B · HOLD STEADY<small>globe locked on you — the arcs move</small></div>
<div class="foot">watch ~10 seconds each · B keeps your country centered the whole time</div>
<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
<script type="module" src="./js/planet-compare.js?v=1"></script>
</body>
</html>
