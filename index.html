<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>The Heal In Tree</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preload" as="image" href="assets/earth_night.jpg">
<link rel="preload" as="image" href="assets/earth_dark.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #d4af37;
    --gold-light: #f0e6c8;
    --gold-dark: #b8973f;
    --text: #e8e8e8;
    --text-dim: #999999;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: 'Cormorant Garamond', serif; color: var(--text); }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

  /* ── HUD ─────────────────────────────────────────────── */
  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
  .counter { position: absolute; top: calc(18px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; }
  #count { font-size: 58px; font-weight: 400; color: var(--gold); line-height: 1.05; text-shadow: 0 0 24px rgba(212,175,55,.35); }
  .counter .label { font-size: 13px; letter-spacing: .42em; color: var(--gold); opacity: .85; margin-top: 2px; }
  .counter .sub { font-size: 11px; letter-spacing: .3em; color: var(--text-dim); opacity: .6; margin-top: 3px; }

  #info {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 16px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,.55); background: rgba(10,10,10,.5);
    color: var(--gold); font-size: 19px; line-height: 38px; text-align: center;
    pointer-events: auto; cursor: pointer; font-family: serif; font-style: italic;
  }

  .buttons {
    position: absolute; bottom: calc(26px + env(safe-area-inset-bottom));
    left: 0; right: 0; display: flex; justify-content: space-evenly; align-items: flex-end;
  }
  .action {
    pointer-events: auto; cursor: pointer; user-select: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: none; border: none; color: var(--gold); font-family: inherit;
  }
  /* Halo Pulse — Selina's pick: soft glow, gentle ripples breathing outward.
     Calming and welcoming; rewarding without being flashy. */
  .action .ring {
    position: relative;
    width: 88px; height: 88px; border-radius: 50%;
    border: none;
    background: radial-gradient(circle, rgba(212,175,55,.30) 0%, rgba(212,175,55,.08) 58%, transparent 72%);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, background .4s ease;
  }
  .action .ring::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    border: 1px solid rgba(212,175,55,.45);
    transition: border-color .35s ease;
  }
  .action .ripple {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(212,175,55,.45);
    animation: ripple 3.6s ease-out infinite;
  }
  .action .r2 { animation-delay: 1.8s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.55); opacity: 0; } }
  .action:active .ring {
    transform: scale(1.07);
    background: radial-gradient(circle, rgba(212,175,55,.45) 0%, rgba(212,175,55,.14) 58%, transparent 74%);
  }
  .action:active .ring::before { border-color: rgba(240,230,200,.85); }
  .action svg { width: 27px; height: 27px; filter: drop-shadow(0 0 9px rgba(212,175,55,.7)); }
  .action .label { font-size: 20px; letter-spacing: .26em; margin-left: .26em; color: var(--gold); }

  #toast {
    position: absolute; bottom: calc(150px + env(safe-area-inset-bottom)); left: 0; right: 0;
    text-align: center; font-size: 16px; color: var(--text-dim);
    opacity: 0; transition: opacity .4s ease; font-style: italic;
  }
  #toast.show { opacity: 1; }

  /* ── Sheets ──────────────────────────────────────────── */
  .sheet {
    position: fixed; inset: 0; background: rgba(10,10,10,.985);
    padding: calc(24px + env(safe-area-inset-top)) 30px 40px;
    overflow-y: auto; display: none; pointer-events: auto;
  }
  .sheet.open { display: block; }
  .sheet .back {
    background: none; border: none; color: var(--gold); font-size: 16px;
    font-family: inherit; cursor: pointer; letter-spacing: .12em; margin-bottom: 26px;
  }
  .sheet h1 { font-size: 34px; font-weight: 300; color: var(--gold); letter-spacing: .04em; margin-bottom: 22px; }
  .sheet h2 { font-size: 20px; font-weight: 500; color: var(--gold); letter-spacing: .05em; margin: 24px 0 8px; }
  .sheet p { font-size: 18px; font-weight: 300; line-height: 1.6; color: var(--text); margin-bottom: 16px; }
  .sheet p.dim { color: var(--text-dim); font-size: 16px; }
  .sheet .privlink {
    background: none; border: none; color: var(--gold-dark); font-size: 14px; font-family: inherit;
    text-decoration: underline; cursor: pointer; margin-top: 12px; letter-spacing: .05em;
  }
  .sheet .foot { margin-top: 28px; color: var(--text-dim); font-size: 13px; letter-spacing: .08em; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 5; transition: opacity .5s ease;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .pulse {
    width: 14px; height: 14px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 18px rgba(212,175,55,.8); animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1.2); opacity: 1; } }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 30px; color: var(--text-dim); font-size: 18px; line-height: 1.6;
  }
</style>
</head>
<body>
<div id="fallback"></div>
<div id="loading"><div class="pulse"></div></div>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="counter">
    <div id="count">0</div>
    <div class="label" data-i18n="actsOfKindness">ACTS OF KINDNESS</div>
    <div class="sub" data-i18n="global24h">24 HOURS · GLOBAL</div>
  </div>
  <button id="info" aria-label="About">i</button>
  <div class="buttons">
    <button class="action" id="act">
      <span class="ring">
        <span class="inner"></span>
        <span class="ripple"></span>
        <span class="ripple r2"></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5h5L9.5 22 19 10h-5.5L13 2z"/></svg>
      </span>
      <span class="label" data-i18n="actButton">ACT</span>
    </button>
    <button class="action" id="receive">
      <span class="ring">
        <span class="inner"></span>
        <span class="ripple"></span>
        <span class="ripple r2"></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.8-9.2C.7 8.7 2.6 5.3 6 5.3c2 0 3.4 1.1 4.2 2.4.3.5 1.3.5 1.6 0 .8-1.3 2.2-2.4 4.2-2.4 3.4 0 5.3 3.4 3.8 6.5C17.5 16.4 12 21 12 21z"/></svg>
      </span>
      <span class="label" data-i18n="receiveButton">RECEIVE</span>
    </button>
  </div>
  <div id="toast"></div>
</div>

<div class="sheet" id="aboutSheet">
  <button class="back" data-i18n="back">← BACK</button>
  <h1 data-i18n="aboutTitle">The Heal In Tree</h1>
  <p data-i18n="aboutBody"></p>
  <p class="dim" data-i18n="aboutDescription"></p>
  <button class="privlink" id="openPrivacy" data-i18n="privacyPolicy">Privacy Policy</button>
  <div class="foot">© 2026 Selina Ingram · The Heal In Tree</div>
</div>

<div class="sheet" id="privacySheet">
  <button class="back" data-i18n="back">← BACK</button>
  <h1 data-i18n="privacyYourPrivacy">Your Privacy</h1>
  <div id="privacySections"></div>
  <div class="foot" data-i18n="privacyLastUpdated">Last updated: October 2026</div>
</div>

<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
<script type="module" src="./js/main.js?v=38"></script>
</body>
</html>
