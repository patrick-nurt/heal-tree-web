<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Heal In Tree — Planet Design Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#d4af37; --bg:#0a0a0a; --dim:#999999; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { font-family:'Cormorant Garamond',serif; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  h1 { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:0; right:0; text-align:center;
       color:var(--gold); font-weight:300; font-size:19px; letter-spacing:.28em; z-index:3; pointer-events:none; }
  .lbl { position:fixed; z-index:3; color:var(--gold); pointer-events:none;
         font-size:15px; letter-spacing:.24em; }
  .lbl small { display:block; color:var(--dim); font-size:11.5px; letter-spacing:.12em;
               font-style:italic; margin-top:3px; }
  #l1 { left:4%;  top:calc(48% - 30px); }
  #l2 { left:54%; top:calc(48% - 30px); }
  #l3 { left:4%;  top:calc(98% - 40px); }
  #l4 { left:54%; top:calc(98% - 40px); }
  .corner { position:fixed; z-index:3; color:var(--dim); font-size:12px; letter-spacing:.1em;
            right:14px; bottom:10px; pointer-events:none; }
</style>
</head>
<body>
<canvas id="lab"></canvas>
<h1>PLANET DESIGN LAB</h1>
<div class="lbl" id="l1">1 · GOLDEN EARTH<small>current — night lights, gold grade</small></div>
<div class="lbl" id="l2">2 · ECLIPSE<small>black disc, brilliant corona rim</small></div>
<div class="lbl" id="l3">3 · AMBER<small>bright warm amber, glowing land</small></div>
<div class="lbl" id="l4">4 · CONSTELLATION<small>dark sphere, graticule + anchor stars</small></div>
<div class="corner">pick a direction · beams &amp; buttons carry over</div>
<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
<script type="module" src="./js/planet-lab.js?v=2"></script>
</body>
</html>
